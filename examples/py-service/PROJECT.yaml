# examples/py-service/PROJECT.yaml
# A RUNNABLE fixture project for Agentic Mahoraga (see README.md and core/schema/PROJECT.schema.yaml).
#
# Like examples/ts-app, the mechanical loop actually runs on this: `setup-fixture.sh` builds a real
# git repo whose last commit is the unit of work (a prorated-refund feature), and the `github-pr`
# tracker adapter's pure-git fallback discovers it (no `gh`, no network). For a run, set `project.root`
# to the `root=` line that `setup-fixture.sh` prints (its parent dir) — or point MAHORAGA_REPO_DIR at
# the `repo=` line, which the github-pr adapter honours directly. The values below are parseable
# defaults.
#
# NOTE: the sibling `fixture/` directory is SEPARATE — it backs the snake_case leak-gate test
# (tests/leak_gate_snake_test.sh), which builds its own hermetic config and does not read this file.

project:
  id:   "py-service"
  name: "py-service (Python fixture)"
  root: "/tmp/py-service-fixture"      # OVERRIDE per run — see setup-fixture.sh `root=`

repos:
  - name:     "py-service"             # dir under project.root AND the sandbox subdir name
    language: "python"                 # selects the snake_case token heuristic + diff-excludes
    verify:
      typecheck_cmd: "python3 -m py_compile src/*.py"   # verdict = exit code (stdlib; no deps)
      # no test_cmd: a pass here is BUILD-VERIFIED, never behavior-verified (honesty rule). Real
      # pytest in the blind sandbox needs provisioning (deps/fixtures/DB) — a follow-on.

tracker:
  adapter: github-pr                   # unit of work = the last merged PR / commit on base_branch
  config:
    # repo: "example/py-service"       # a real run sets "owner/name" (basename locates the checkout).
    repo:           ""                 # LEFT EMPTY so the adapter ALWAYS takes the pure-git fallback,
                                       #   even where `gh` is installed (else it would try the GitHub
                                       #   API and fail). The checkout is then found via
                                       #   project.root/<repo> or MAHORAGA_REPO_DIR (see setup-fixture.sh).
    base_branch:    "main"
    merge_strategy: "squash"           # pure-git fallback lists the last N non-merge commits
    labels_exclude: ["automated", "dependabot"]

spec:
  adapter: markdown                    # the design note is a file in the repo
  config:
    glob: "SPEC.md"                    # searched under project.root and project.root/<repo>

vcs:
  adapter: git
  base_branch: "main"

skills:
  source_dir: "examples/py-service/.claude/skills"   # resolvable from the repo root; the fixture also
                                                      # stages a copy next to the checkout (skills= line)
  derived_skills: []

selection:
  n: 5
  complexity_spread: false
  require_multi_repo: false            # single-repo — the cross-repo lost-context probe is N/A

decontamination:
  # No curated answer_tokens: the gate AUTO-derives the snake_case answer symbol
  # (`compute_prorated_refund`) from the human diff via core/lib/lang_profiles.py.
  exclusion: []                        # already-evaluated units; appended each run
  cutoff_policy:
    require_post_cutoff_for_headline: true
    # A fictional PRIVATE payments/billing service => the private path labels units "cutoff-clean"
    # (not in public pretraining). This is the deliberate counterpart to ts-app, which is `public`
    # (=> "cutoff-unverified"), so the two fixtures exercise BOTH label outcomes.
    repo_visibility: private
    model_cutoff:  "2024-10-01"        # ISO; illustrative model pretraining cutoff. Used by the
                                       #   labeler when visibility is public/unknown; the private
                                       #   path above short-circuits to cutoff-clean before it.
